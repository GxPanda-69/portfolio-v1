<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aston</title>
    <style>
      body {
        background-color: black;
        color: white;
      }

      img {
        opacity: 0;
      }

      p {
        opacity: 0;
      }

      .animation {
        opacity: 100%;
        animation: image 5s linear;
      }

      @keyframes image {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 100%;
        }
      }
    </style>
  </head>
  <body>
    <button onclick="enter()" id="enter"><i>enter</i></button>
    <audio id="sound" src="assets/audio/music/clair-de-lune.mp3" loop></audio>
    <img src="assets/images/aston.png" alt="" id="image" />
    <p id="title">je suis ce que je suis</p>
  </body>
  <script>
    const audio = document.getElementById("sound");
    audio.volume = 0.5;

    function enter() {
      audio.play();
      document.querySelector("#enter").remove();
      document.querySelector("#image").setAttribute("class", "animation");
      document.querySelector("#title").setAttribute("class", "animation");
    }
  </script>
</html>
